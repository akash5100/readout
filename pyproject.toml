[project]
name = "tts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.36.2",
    "num2words>=0.5.14",
    "numpy>=2.5.4",
    "pocket-tts>=4.0.1,<5",
    "pynput>=1.8.2",
    "pyobjc-core>=12.2.2",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "qwen-tts>=0.1.1",
    "setproctitle>=1.3.8",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
    "starlette>=1.8.0",
]
